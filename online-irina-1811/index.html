const key = 'vska_irina_strict_80';
let saved = {};

try { saved = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) {}

// Automatically scan and import any suitable / checked leads from ALL previous versions in localStorage
try {
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('vska_')) {
      try {
        const oldData = JSON.parse(localStorage.getItem(k) || '{}');
        for (const [rawU, val] of Object.entries(oldData)) {
          const isSuitable = val && (val.state === 'recent' || val === true || val === 'recent' || val.checked === true);
          if (isSuitable) {
            const u = rawU.toLowerCase().replace(/^@/, '').trim();
            if (!saved[u]) {
              saved[u] = typeof val === 'object' ? val : { state: 'recent', checked_at: new Date().toISOString() };
            }
          }
        }
      } catch(err) {}
    }
  }
  localStorage.setItem(key, JSON.stringify(saved));
} catch(e) {}

// Any marked lead that wasn't in pool is unshifted to the top
const poolUsers = new Set(pool.map(x => x.u.toLowerCase()));
const extraChecked = [];
for (const u of Object.keys(saved)) {
  const uLow = u.toLowerCase();
  if (!poolUsers.has(uLow)) {
    const info = known[uLow] || {};
    extraChecked.push({
      n: 0,
      u: uLow,
      name: info.name || ('@' + uLow),
      city: info.city || '',
      niche: info.niche || '',
      badge: '⭐ Подтверждён вами ранее' + (info.badge ? ' · ' + info.badge : ''),
      is_gold: true,
      card: info.card || ('https://t.me/' + uLow)
    });
    poolUsers.add(uLow);
  }
}

if (extraChecked.length > 0) {
  pool.unshift(...extraChecked);
}
pool.forEach((x, idx) => { x.n = idx + 1; });

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render() {
  const q = document.querySelector('#search').value.toLowerCase();
  const f = document.querySelector('#filter').value;
  const shown = pool.filter(x => {
    const matchText = (x.name + ' ' + x.city + ' ' + x.u + ' ' + x.niche + ' ' + (x.badge || '')).toLowerCase().includes(q);
    const isChecked = !!saved[x.u];
    if (!matchText) return false;
    if (f === 'checked') return isChecked;
    if (f === 'unchecked') return !isChecked;
    return true;
  });

  document.querySelector('#cards').innerHTML = shown.map(x => {
    const checked = !!saved[x.u];
    const isGold = !!x.is_gold;
    return '<article class="' + (checked ? 'is-checked' : '') + '">'
      + '<h2>№' + x.n + ' · ' + esc(x.name) + '</h2>'
      + '<div class="meta">' + esc(x.city) + ' / ' + esc(x.niche) + '</div>'
      + (x.badge ? '<div class="badge ' + (isGold ? 'gold' : '') + '">' + esc(x.badge) + '</div>' : '')
      + '<div class="links">'
        + '<div class="link-group">'
          + '<a href="https://t.me/' + x.u + '" target="_blank" rel="noopener">@' + x.u + '</a>'
          + '<a href="' + x.card + '" target="_blank" rel="noopener">2ГИС</a>'
        + '</div>'
        + '<label class="check-label">'
          + '<input type="checkbox" data-u="' + x.u + '"' + (checked ? ' checked' : '') + '>'
          + '<span>Подходит (онлайн ОК)</span>'
        + '</label>'
      + '</div>'
    + '</article>';
  }).join('');

  const totalChecked = Object.keys(saved).length;
  document.querySelector('#count').textContent = 'Отмечено подходящих: ' + totalChecked + ' из ' + pool.length + ' (показано ' + shown.length + ')';
}

document.querySelector('#search').addEventListener('input', render);
document.querySelector('#filter').addEventListener('change', render);

document.querySelector('#cards').addEventListener('change', e => {
  if (!e.target.matches('input[type="checkbox"]')) return;
  const u = e.target.dataset.u;
  if (e.target.checked) {
    saved[u] = { state: 'recent', checked_at: new Date().toISOString() };
  } else {
    delete saved[u];
  }
  try {
    localStorage.setItem(key, JSON.stringify(saved));
    document.querySelector('#status').textContent = 'Отметка сохранена';
  } catch(e) {
    document.querySelector('#status').textContent = 'Ошибка сохранения в браузере';
  }
  render();
});

document.querySelector('#export').addEventListener('click', async () => {
  const results = pool.filter(x => saved[x.u]).map(x => ({
    n: x.n,
    u: x.u,
    name: x.name,
    city: x.city,
    niche: x.niche,
    badge: x.badge,
    ...saved[x.u]
  }));
  if (!results.length) {
    document.querySelector('#status').textContent = 'Пока не отмечено ни одной галочки';
    return;
  }
  const text = JSON.stringify({ date: '2026-11-18', source: '80 горячих лидов · Для Ирины (все ниши)', count: results.length, results }, null, 2);
  try {
    await navigator.clipboard.writeText(text);
    document.querySelector('#status').textContent = 'Скопировано ' + results.length + ' подходящих лидов в буфер! Пришли их в чат.';
  } catch(e) {
    const el = document.querySelector('#fallback');
    el.hidden = false;
    el.value = text;
    el.focus();
    el.select();
    document.querySelector('#status').textContent = 'Скопируй выделенный текст и пришли в чат.';
  }
});

render();
})();
